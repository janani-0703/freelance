   <section class="contact">
  <div class="contact-card">
    <h2>Get in Touch</h2>
    <p>Have a project in mind? Let’s build something amazing together.</p>

    <form id="contactForm">
      <input type="text" id="name" placeholder="Your Name" required>
      <input type="text" id="phone" placeholder="Your Mobileno" required>
      <input type="email" id="email" placeholder="Your Email" required>
      <textarea id="message" placeholder="Your Message" required></textarea>
      <button type="submit" class="btn">Send to WhatsApp</button>
    </form>
  </div>
</section>
<div class="social-contact">
  <p>Or connect with us directly</p>

  <div class="social-links">
    <a href="https://wa.me/919894596141" target="_blank" class="social whatsapp">
      <i class="fab fa-whatsapp"></i>
    </a>
    <a href="mailto:jaivikramofficial@gmail.com" class="social email">
      <i class="fas fa-envelope"></i>
    </a>
    <a href="https://instagram.com/yourusername" target="_blank" class="social instagram">
      <i class="fab fa-instagram"></i>
    </a>
    <a href="https://github.com/yourusername" target="_blank" class="social github">

</div>
<script>
document.getElementById("contactForm").addEventListener("submit", function(e){
  e.preventDefault();

  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let email = document.getElementById("email").value;
  let message = document.getElementById("message").value;

  let whatsappNumber = "919894596141"; 
  let text = `Name: ${name}%0APhone: ${phone}%0AEmail: ${email}%0AMessage: ${message}`;

  let url = `https://wa.me/${whatsappNumber}?text=${text}`;
  window.open(url, "_blank");
});
</script>
